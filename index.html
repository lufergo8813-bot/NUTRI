<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2545"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<title>Recomp · Recomposición corporal</title>
<style>
:root{--n:#0B2545;--n2:#13315C;--m:#5FD3B3;--m2:#DFF7F0;--c:#FF7A66;--c2:#FFE6E1;--bg:#F3F9F8;--g:#6B7C93}
*{box-sizing:border-box;margin:0}
body{font:15px/1.4 "Avenir Next","Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:var(--n);padding-bottom:calc(82px + env(safe-area-inset-bottom))}
header{background:var(--n);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 18px 56px;border-radius:0 0 28px 28px}
h1{font:700 24px Georgia,serif}
main{margin:-38px 14px 0;display:grid;gap:12px}
.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 6px 18px #0b25451a}
h2{font-size:16px;margin-bottom:8px}
small,.s{font-size:12px;color:var(--g)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #dbe8e6;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;font:11px inherit;color:var(--g);padding:4px}
nav button.on{color:var(--n);font-weight:700}
nav i{display:block;font-style:normal;font-size:21px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;background:var(--m2);font-weight:600;margin:2px 3px 2px 0}
.chip.c{background:var(--c2);color:#b8402d}
.bar{height:8px;border-radius:9px;background:#e6efee;overflow:hidden;margin:3px 0 8px}.bar b{display:block;height:100%;border-radius:9px}
input,select{width:100%;padding:10px;border:1.5px solid #d3e3e1;border-radius:12px;font:inherit;background:#fff;color:var(--n)}
label{font-size:12px;color:var(--g);display:block;margin:9px 0 3px}
.btn{background:var(--c);color:#fff;border:0;border-radius:14px;padding:12px;font:700 15px inherit;width:100%;margin-top:10px}
.btn.n{background:var(--n)}.btn.m{background:var(--m);color:var(--n)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.donut{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut div{width:82px;height:82px;background:#fff;border-radius:50%;display:grid;place-items:center;text-align:center;font:700 18px/1.1 Georgia,serif}
.ev{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #edf3f2}
.ev:last-child{border:0}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--m);flex:none;display:grid;place-items:center;color:#fff;font-size:14px}
.ck.on{background:var(--m)}
.t{font-weight:700;width:46px;flex:none}
.sb{flex:1;border:1.5px solid #d3e3e1;background:#fff;border-radius:12px;padding:8px 2px;font:12px inherit;color:var(--n)}
.sb.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:700}
.tw{overflow-x:auto}table{border-collapse:collapse;font-size:12px;width:100%;min-width:430px}
td,th{padding:7px 4px;text-align:center;border-bottom:1px solid #e6efee}th{color:var(--g);font-weight:600}tr.now{background:var(--m2);font-weight:700}
.ring{position:relative;width:170px;height:170px;border-radius:50%;margin:6px auto}
.ring>div.in{position:absolute;inset:25px;background:#fff;border-radius:50%;display:grid;place-items:center;text-align:center;font:700 22px/1.1 Georgia,serif}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.strip span{border-radius:8px;text-align:center;padding:6px 0;font-size:11px;color:#fff}
</style></head><body>
<div id="app"></div><nav id="nav"></nav>
<script>
const K='recomp_v1',$=s=>document.querySelector(s);
let S=JSON.parse(localStorage.getItem(K)||'null')||{p:null,w:[],t:{},h:{}},tab='hoy',sel=null;
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>iso(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(a+'T12:00')-new Date(b+'T12:00'))/864e5);
const fd=s=>new Date(s+'T12:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'});
const r1=v=>Math.round(v*10)/10,cl=(v,a,b)=>Math.min(Math.max(v,a),b);
const hd=(t,s,x='')=>`<h1>${t}</h1><div style="opacity:.8;font-size:13px;margin-top:2px">${s}</div>${x}`;

/* ---------- Cálculo del plan (todo indexado a la semana i y a tus datos iniciales) ---------- */
const effW=n=>{let e=0;for(let i=0;i<n;i++)e+=(i+1)%4==0?0:i<2?.6:1;return e};
function simEnd(p,n,r){const tmb=10*p.peso+6.25*p.altura-5*p.edad-161,tdee=tmb*p.act;let w=p.peso;for(let i=0;i<n;i++){const df=(i+1)%4==0?0:r*7700/7*(i<2?.6:1),k=Math.max(tdee-df,tmb,1200);w-=(tdee-k)*7/7700}return w}
function semNec(p){const L=p.peso-p.meta,cap=p.peso*.0075;for(let n=4;n<300;n++)if(simEnd(p,n,Math.min(L/effW(n),cap))<=p.meta+.15)return n;return 300}
function base(p){const tmb=10*p.peso+6.25*p.altura-5*p.edad-161,tdee=tmb*p.act,cap=p.peso*.0075;let r=(p.peso-p.meta)/effW(p.sem),w='',need=0;
 if(r>cap)r=cap;
 if(p.meta<p.peso&&simEnd(p,p.sem,r)>p.meta+.15){need=semNec(p);w='Con '+p.sem+' semanas, el ritmo seguro te lleva a ~'+r1(simEnd(p,p.sem,r))+' kg. Para llegar a '+p.meta+' kg necesitas ~'+need+' semanas.'}
 if(r<-cap/2)r=-cap/2;return{tmb,tdee,r,w,need}}
function wk(p,i){const b=base(p),d=(i+1)%4==0,ramp=i<2?.6:1,aj=!!(S.aj&&i>=S.aj.i0&&(S.aj.i1==null||i<S.aj.i1)),df=d?0:b.r*7700/7*ramp*(aj&&b.r>0?.7:1),
 k=Math.round(Math.max(b.tdee-df,b.tmb,1200)/5)*5,pr=Math.round(p.peso*((i<2?1.8:2)+(aj?.2:0))),fa=Math.round(p.peso*.8),ch=Math.max(Math.round((k-pr*4-fa*9)/4),50);
 return{i,k,pr,fa,ch,d,aj,def:b.tdee-k,fase:d?'Descarga':i<2?'Adaptación':i<p.sem*.6?'Construcción':'Intensidad',cardio:Math.min(20+Math.floor(i/2)*5,45),pasos:Math.min(7000+Math.floor(i/4)*500,10000),rpe:d||i<2?6:i<p.sem*.6?7:8}}
function curve(p){let w=p.peso;const a=[w];for(let i=0;i<p.sem;i++){w-=wk(p,i).def*7/7700;a.push(r1(w))}return a}
const wi=(d=today())=>cl(Math.floor(diff(d,S.p.ini)/7),0,S.p.sem-1);

/* ---------- Ciclo menstrual ---------- */
const FA=[['Menstrual','#FF7A66','Energía variable: entrena según cómo te sientas, prioriza movilidad y alimentos con hierro (carnes, lentejas con vitamina C).',0],
['Folicular','#5FD3B3','Buena energía y recuperación: el mejor momento para subir cargas y buscar récords.',0],
['Ovulación','#2BB39A','Fuerza alta. Calienta bien y cuida rodillas en saltos y cambios de dirección.',0],
['Lútea','#13315C','Más hambre y menos recuperación: sumo +100 kcal. Si estás cansada baja 1 serie accesoria. Los antojos son normales.',100]];
function fase(d){const p=S.p;if(p.cy!='si'||!p.cs)return null;const L=p.cl||28,n=((diff(d,p.cs)%L)+L)%L+1,o=Math.round(L/2);return{n,L,o,f:n<=5?0:n<o-1?1:n<=o+1?2:3}}
function dia(d){const w=wk(S.p,wi(d)),c=fase(d),x=c?FA[c.f][3]:0;return{...w,k:w.k+x,ch:w.ch+Math.round(x/4),c}}

/* ---------- Comidas y entrenos ---------- */
const ML={3:[['Desayuno',1,30],['Almuerzo',6,40],['Cena',11.5,30]],4:[['Desayuno',1,25],['Almuerzo',5,35],['Merienda',9,15],['Cena',12,25]],5:[['Desayuno',1,22],['Media mañana',4,12],['Almuerzo',7,28],['Merienda',10,12],['Cena',12.5,26]]};
const tmin=s=>{const[a,b]=s.split(':').map(Number);return a*60+b},fm=m=>{m%=1440;return String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const mt=o=>Math.round((tmin(S.p.wake)+o*60)/5)*5;
const DS={3:[1,3,5],4:[1,2,4,5],5:[1,2,3,4,5]},DH={3:[2,6],4:[3,6],5:[6]},SN=['','😊 Fácil','🙂 Bien','😤 Duro','🥵 Límite'];
const GR=['Glúteo','Cuádriceps','Isquios','Pantorrilla','Espalda','Pecho','Hombro','Bíceps','Tríceps','Core','Full body'];
const HI={cam:{warm:'Camina rápido con inclinación 1-2% y sube el ritmo poco a poco.',hard:'Trote o carrera fuerte, o caminata en inclinación 8-12%. Esfuerzo 8 de 10: solo alcanzas a decir 2-3 palabras.',easy:'Camina suave (4-5 km/h) y recupera el aire.',cool:'Camina suave y baja la inclinación a 0.'},
bici:{warm:'Pedalea ligero con resistencia baja y sube la cadencia poco a poco.',hard:'Resistencia media-alta y pedaleo rápido (90+ rpm). Esfuerzo 8 de 10: solo alcanzas a decir 2-3 palabras.',easy:'Pedalea suave con resistencia baja (60-70 rpm).',cool:'Pedalea muy suave hasta que baje el pulso.'}};
function hiit(){const p=S.p,w=wk(p,wi()),c=fase(today());let f=w.d||w.i<2?[6,30,90]:w.i<p.sem*.6?[8,35,60]:[10,40,50],red=0;
 if(c&&(c.f==0||(c.f==3&&c.n>c.L-4))){f=[Math.max(f[0]-2,4),f[1],f[2]+20];red=1}
 return{n:f[0],w:f[1],r:f[2],red,ses:w.i<2?1:DH[p.dias].length,tot:Math.round(10+f[0]*(f[1]+f[2])/60)}}
function segs(h,eq){const I=HI[eq],s=[['Calentamiento',300,'warm',I.warm]];for(let r=1;r<=h.n;r++)s.push(['🔥 Fuerte · '+r+' de '+h.n,h.w,'hard',I.hard],['Suave',h.r,'easy',I.easy]);s.push(['Enfriamiento',300,'cool',I.cool]);return s}
let TM=null,tmI=null,AC;
const mmss=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
function tmH(){const h=hiit();if(!TM)return`<button class=btn onclick="tgo()">▶ Iniciar temporizador (${h.tot} min)</button>`;const s=TM.sg[TM.i],col=s[2]=='hard'?'var(--c)':s[2]=='easy'?'#2BB39A':'var(--n2)';
 return`<div style="background:${col};color:#fff;border-radius:18px;padding:18px;text-align:center"><div style="font-weight:700">${s[0]}</div><div style="font:700 56px Georgia,serif">${mmss(TM.left)}</div><div style="font-size:13px">${s[3]}</div></div><button class="btn n" onclick="tstop()">⏹ Detener</button>`}
const paint=()=>{const e=$('#tmbox');if(e)e.innerHTML=tmH()};
function beep(){try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator();o.connect(AC.destination);o.frequency.value=880;o.start();o.stop(AC.currentTime+.25)}catch(e){}navigator.vibrate&&navigator.vibrate(250)}
function tgo(){const sg=segs(hiit(),S.eq||'cam');TM={sg,i:0,left:sg[0][1]};clearInterval(tmI);tmI=setInterval(tick,1000);try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}beep();paint()}
function tick(){TM.left--;if(TM.left<=0){TM.i++;beep();if(TM.i>=TM.sg.length)return tstop(1);TM.left=TM.sg[TM.i][1]}paint()}
function tstop(ok){clearInterval(tmI);TM=null;if(ok)hdone();else R()}
const st=(k,v)=>{const t=S.t[today()]=S.t[today()]||{};t[k]=k=='m'?+v:v;save()};
function gt(g){const t=S.t[today()]=S.t[today()]||{};t.g=t.g||[];const i=t.g.indexOf(g);i<0?t.g.push(g):t.g.splice(i,1);save();R()}
function hdone(){const t=S.t[today()]=S.t[today()]||{};t.hiit={...(t.hiit||{}),eq:S.eq||'cam'};save();R()}
function gsave(){const t=S.t[today()]||{};if(!t.g||!t.g.length){alert('Marca primero el grupo muscular que trabajaste');return}t.gok=1;S.t[today()]=t;save();R()}
const hs=v=>{S.t[today()].hiit.s=v;save();R()};
function sem(){const d0=addD(today(),-((new Date().getDay()+6)%7));let g=0,h=0;for(let k=0;k<7;k++){const t=S.t[addD(d0,k)];if(t&&t.g&&t.g.length)g++;if(t&&t.hiit)h++}return[g,h]}
const hb=(k,v)=>{const h=S.h[today()]=S.h[today()]||{a:0,m:[]};if(k=='a')h.a=Math.max(0,h.a+v);else if(k=='m')h.m[v]=!h.m[v];else h[k]=!h[k];save();R()};

/* ---------- Pantallas ---------- */
function hoy(){const p=S.p,d=today(),x=dia(d),h=S.h[d]||{a:0,m:[]},dow=new Date().getDay(),gy=DS[p.dias].includes(dow),hy=DH[p.dias].slice(0,x.i<2?1:9).includes(dow),
 lw=S.w.length?S.w[S.w.length-1].w:p.peso,pg=cl((p.peso-lw)/((p.peso-p.meta)||1)*100,0,100),
 tot=x.pr*4+x.ch*4+x.fa*9,a=x.pr*4/tot*100,b=a+x.ch*4/tot*100,vasos=Math.round(p.peso*35/250);
 const ev=ML[p.nc].map(([n,o,pc],i)=>({m:mt(o),h:`<div class=ev onclick="hb('m',${i})"><div class="ck ${h.m[i]?'on':''}">${h.m[i]?'✓':''}</div><div class=t>${fm(mt(o))}</div><div style="flex:1"><b>${n}</b><br><small>P ${Math.round(x.pr*pc/100)} · C ${Math.round(x.ch*pc/100)} · G ${Math.round(x.fa*pc/100)} g</small></div></div>`}));
 ev.push({m:tmin(p.tr),h:`<div class=ev style="background:var(--c2);border-radius:12px;padding:9px"><div class=t>${p.tr}</div><div style="flex:1"><b>${gy?'🏋️ Pesas en el gym':hy?'🔥 HIIT · '+hiit().tot+' min':'🚶 Descanso activo'}</b><br><small>${gy?'Come 1-2 h antes y proteína dentro de 2 h después':hy?'Caminadora o bici estática (mira Entreno)':'Caminata o movilidad 30 min'}</small></div></div>`});
 ev.sort((u,v)=>u.m-v.m);
 const hab=(k,t,s)=>`<div class=ev onclick="hb('${k}')"><div class="ck ${h[k]?'on':''}">${h[k]?'✓':''}</div><div><b>${t}</b><br><small>${s}</small></div></div>`;
 return[hd('Hola, '+p.nombre,`Semana ${x.i+1} de ${p.sem} · ${x.fase}`,`<div class=bar style="background:#13315C;margin-top:14px"><b style="width:${pg}%;background:var(--m)"></b></div><div class=s style="color:#bcd">${lw} kg → ${p.meta} kg · ${Math.round(pg)}% del camino</div>`),
 `<div class=card><div class=row style="gap:14px"><div class=donut style="background:conic-gradient(#5FD3B3 0 ${a}%,#13315C ${a}% ${b}%,#FF7A66 ${b}% 100%)"><div><span>${x.k}<br><small>kcal</small></span></div></div><div style="flex:1">`+
 [['Proteína',x.pr,'#5FD3B3',4],['Carbohidratos',x.ch,'#13315C',4],['Grasas',x.fa,'#FF7A66',9]].map(([n,v,c,m])=>`<div style="font-size:13px">${n} <b>${v} g</b></div><div class=bar><b style="width:${v*m/tot*100}%;background:${c}"></b></div>`).join('')+`</div></div>`+(x.c?`<span class=chip>Fase ${FA[x.c.f][0].toLowerCase()} · día ${x.c.n}</span>`:'')+(x.aj?`<span class="chip c">Ajuste por masa magra activo</span>`:'')+`</div>`+
 `<div class=card><h2>Tu día</h2>${ev.map(e=>e.h).join('')}</div>`+
 `<div class=card><h2>Hábitos de hoy</h2><div class=ev><div style="flex:1"><b>💧 Agua</b><br><small>${h.a} de ${vasos} vasos (250 ml)</small><div class=bar><b style="width:${cl(h.a/vasos*100,0,100)}%;background:var(--m)"></b></div></div><button class="sb" style="flex:none;width:40px" onclick="hb('a',-1)">−</button><button class="sb on" style="flex:none;width:40px" onclick="hb('a',1)">+</button></div>${hab('p','👟 Pasos',x.pasos+' pasos')}${hab('s','😴 Sueño','7 a 9 horas')}${hab('z','🚶 Cardio suave',x.cardio+' min zona 2 (puedes hablar)')}</div>`+
 (x.c?`<div class=card><h2>Tu fase: ${FA[x.c.f][0]}</h2><p style="font-size:14px">${FA[x.c.f][2]}</p></div>`:'')]}

function plan(){const p=S.p,b=base(p),c=curve(p),n=wi(),w=wk(p,0);
 return[hd('Tu plan',`${p.sem} semanas · de ${p.peso} a ${p.meta} kg`),
 `<div class=card><h2>Cómo se calculó</h2><p style="font-size:14px">Tu cuerpo gasta en reposo ~<b>${Math.round(b.tmb)} kcal</b>; con tu actividad, ~<b>${Math.round(b.tdee)} kcal</b> al día. Ritmo: <b>${r1(Math.abs(b.r)*1000)/1000} kg por semana</b>${b.r>0?' (déficit suave, escalonado)':' (superávit suave)'}. Las semanas 1-2 arrancan al 60% y cada 4.ª semana subes a mantenimiento para recuperar energía. Proteína ${r1(1.8)}→2 g/kg para cuidar el músculo, grasas 0,8 g/kg y carbohidratos con el resto.</p>${b.w?`<p class=chip style="background:var(--c2);white-space:normal;margin-top:8px">${b.w}</p><button class="btn m" onclick="S.p.sem=${b.need};save();R()">Usar ${b.need} semanas</button>`:''}</div>`+
 `<div class=card><h2>Semana a semana</h2><div class=tw><table><tr><th>Sem</th><th>Fase</th><th>kcal</th><th>P</th><th>C</th><th>G</th><th>Peso est.</th><th>Cardio</th><th>Pasos</th></tr>${c.slice(1).map((v,i)=>{const x=wk(p,i);return`<tr class="${i==n?'now':''}"><td>${i+1}</td><td>${x.fase}${x.aj?' ✱':''}</td><td>${x.k}</td><td>${x.pr}</td><td>${x.ch}</td><td>${x.fa}</td><td>${v}</td><td>${x.cardio}'</td><td>${x.pasos}</td></tr>`}).join('')}</table></div><p class=s style="margin-top:6px">P, C, G = gramos de proteína, carbohidrato y grasa por día. En fase lútea la app suma +100 kcal sola. ✱ = semana con ajuste por masa magra.</p></div>`]}

function ent(){const p=S.p,d=today(),t=S.t[d]||{},dow=new Date().getDay(),gy=DS[p.dias].includes(dow),hy=DH[p.dias].slice(0,wi()<2?1:9).includes(dow),h=hiit(),eq=S.eq||'cam',[ng,nh]=sem(),I=HI[eq];
 return[hd('Entreno',gy?'Hoy toca pesas en el gym':hy?'Hoy toca HIIT':'Hoy: descanso activo (caminata o movilidad)',`<div class=s style="color:#bcd;margin-top:8px">Esta semana: ${ng} días de pesas · ${nh} de HIIT</div>`),
 `<div class=card><h2>🏋️ Pesas en el gym</h2><small>Tu rutina ya viene guiada en el gym. Aquí solo marca qué grupos trabajaste.</small><div style="margin-top:8px">${GR.map(g=>`<span class="chip ${t.g&&t.g.includes(g)?'c':''}" onclick="gt('${g}')">${g}</span>`).join('')}</div><label>¿Cómo se sintió?</label><div class=row style="gap:5px">${[1,2,3,4].map(v=>`<button class="sb ${t.s==v?'on':''}" onclick="st('s',${v});R()">${SN[v]}</button>`).join('')}</div><div class=g2><div><label>Minutos</label><input type=number inputmode=numeric value="${t.m??''}" oninput="st('m',this.value)"></div><div><label>Nota (opcional)</label><input value="${esc(t.n)}" oninput="st('n',this.value)"></div></div><button class="btn m" onclick="gsave()">Guardar sesión de pesas</button>${t.gok?'<p style="margin-top:8px"><b>✅ Sesión de pesas guardada</b></p>':''}</div>`+
 `<div class=card><h2>🔥 HIIT · ${h.ses} ${h.ses>1?'sesiones':'sesión'} por semana</h2><span class="chip ${eq=='cam'?'c':''}" onclick="S.eq='cam';save();R()">Caminadora</span><span class="chip ${eq=='bici'?'c':''}" onclick="S.eq='bici';save();R()">Bici estática</span>
 <div class=g2 style="grid-template-columns:repeat(3,1fr);margin:10px 0;text-align:center">${[[h.n,'rondas'],[h.w+' s','fuerte'],[h.r+' s','suave']].map(([a,b],i)=>`<div style="background:${i==1?'var(--c2)':'var(--m2)'};border-radius:14px;padding:10px"><div style="font:700 22px Georgia,serif">${a}</div><small>${b}</small></div>`).join('')}</div>
 ${h.red?'<p class=chip style="background:var(--c2);white-space:normal">Por tu fase del ciclo bajé 2 rondas y alargué la recuperación.</p>':''}
 <h2 style="margin-top:8px">Cómo hacer la sesión (${h.tot} min)</h2><ol style="font-size:14px;padding-left:18px;display:grid;gap:6px"><li><b>Calentamiento 5 min.</b> ${I.warm}</li><li><b>${h.n} rondas:</b> ${h.w} s fuerte + ${h.r} s suave.<br><b>Fuerte:</b> ${I.hard}<br><b>Suave:</b> ${I.easy}</li><li><b>Enfriamiento 5 min.</b> ${I.cool}</li></ol>
 <p class=s style="margin:8px 0">Deja 48 h entre sesiones de HIIT. Si dormiste mal o vienes muy cansada, cámbiala por 30 min de cardio suave. Si sientes mareo o dolor en el pecho, para.</p>
 <div id=tmbox>${tmH()}</div>${t.hiit?`<p style="margin-top:10px"><b>✅ HIIT registrada</b> (${t.hiit.eq=='cam'?'caminadora':'bici'})</p><label>¿Cómo se sintió?</label><div class=row style="gap:5px">${[1,2,3,4].map(v=>`<button class="sb ${t.hiit.s==v?'on':''}" onclick="hs(${v})">${SN[v]}</button>`).join('')}</div>`:`<button class="btn m" onclick="hdone()">Marcar HIIT como hecha</button>`}</div>`]}

function chart(){const p=S.p,c=curve(p),W=[...S.w].sort((a,b)=>a.d<b.d?-1:1),all=[...c,...W.map(x=>x.w),p.meta],mn=Math.min(...all)-1,mx=Math.max(...all)+1,
 X_=v=>34+cl(v,0,p.sem)/p.sem*276,Y=v=>10+(mx-v)/(mx-mn)*128,pts=W.map(x=>[X_(diff(x.d,p.ini)/7),Y(x.w)]);
 return`<svg viewBox="0 0 320 160" width="100%"><line x1=34 x2=310 y1=${Y(p.meta)} y2=${Y(p.meta)} stroke="#5FD3B3" stroke-width=2 stroke-dasharray="3 4"/><text x=36 y=${Y(p.meta)-4} font-size=9 fill="#2BB39A">meta ${p.meta}</text><polyline fill=none stroke="#13315C" stroke-width=2 stroke-dasharray="5 4" points="${c.map((v,i)=>X_(i)+','+Y(v)).join(' ')}"/>
 <polyline fill=none stroke="#FF7A66" stroke-width=3 points="${pts.join(' ')}"/>${pts.map(q=>`<circle cx=${q[0]} cy=${q[1]} r=4 fill="#FF7A66"/>`).join('')}<text x=2 y=16 font-size=9 fill="#6B7C93">${Math.round(mx)}</text><text x=2 y=140 font-size=9 fill="#6B7C93">${Math.round(mn)}</text><text x=34 y=156 font-size=9 fill="#6B7C93">sem 0</text><text x=290 y=156 font-size=9 fill="#6B7C93">sem ${p.sem}</text></svg>`}
const MD=[['c','Cintura (la más estrecha)'],['ab','Abdomen (ombligo)'],['ca','Cadera (la más ancha)'],['cu','Cuello'],['pe','Pecho / busto'],['br','Brazo relajado'],['mu','Muslo alto']];
function comp(x){if(!x||!x.c||!x.ca||!x.cu)return null;const h=S.p.altura,q=x.c+x.ca-x.cu;if(q<=0)return null;const bf=495/(1.29579-.35004*Math.log10(q)+.221*Math.log10(h))-450;if(!(bf>3&&bf<60))return null;const gm=x.w*bf/100;return{bf:r1(bf),gm:r1(gm),mm:r1(x.w-gm)}}
const icc=x=>x&&x.c&&x.ca?Math.round(x.c/x.ca*100)/100:null;
function chk(){const ce=S.w.filter(x=>comp(x));if(ce.length<2||diff(ce[ce.length-1].d,ce[0].d)<14)return;const dM=comp(ce[ce.length-1]).mm-comp(ce[0]).mm,a=S.aj&&S.aj.i1==null;
 if(!a&&dM<-.8)S.aj={i0:wi(),i1:null};else if(a&&dM>-.3)S.aj.i1=wi()+1}
function lw(){const v=+$('#pw').value;if(!v){alert('Escribe tu peso');return}const d=$('#pd').value||today(),o={d,w:v};MD.forEach(([k])=>{const n=+$('#m_'+k).value;if(n)o[k]=n});const a=S.w.find(x=>x.d==d);S.w=S.w.filter(x=>x.d!=d);S.w.push({...a,...o});S.w.sort((u,v)=>u.d<v.d?-1:1);chk();save();R()}
function prog(){const p=S.p,W=S.w,l=W.length?W[W.length-1]:null,e=curve(p)[wi()+(diff(today(),p.ini)>=0?1:0)]??p.peso,df=l?r1(l.w-e):0,
 msg=!l?'Registra tu primer peso para ver cómo vas contra el plan.':df>.8?'Vas por encima del plan. Antes de bajar calorías, revisa porciones, pasos y sueño; una semana irregular no define el resultado.':df<-.8?'Vas más rápido que el plan. Cuida que la energía y el rendimiento en el entreno no caigan.':'Vas en línea con el plan. Sigue así.',
 cw=W.filter(x=>comp(x)),A=cw.length?comp(cw[0]):null,B=cw.length?comp(cw[cw.length-1]):null,
 pick=k=>{const v=W.filter(x=>x[k]);return v.length?[v[0][k],v[v.length-1][k]]:null},
 row=(n,a,b,g)=>{const dl=Math.round((b-a)*100)/100,col=g*dl>0?'#1b9c82':g*dl<0?'#d4513e':'inherit';return`<tr><td style="text-align:left">${n}</td><td>${a}</td><td>${b}</td><td style="color:${col};font-weight:700">${dl>0?'+':''}${dl}</td></tr>`};
 let rows='';const pw=pick('w');if(pw&&W.length>1)rows+=row('Peso (kg)',pw[0],pw[1],p.meta<p.peso?-1:1);
 MD.forEach(([k,n])=>{const v=pick(k);if(v&&v[0]!=v[1]||v&&W.filter(x=>x[k]).length>1)rows+=row(n.split(' (')[0]+' (cm)',v[0],v[1],['c','ab','ca'].includes(k)?-1:0)});
 if(A&&B&&cw.length>1)rows+=row('% grasa (est.)',A.bf,B.bf,-1)+row('Masa grasa (kg)',A.gm,B.gm,-1)+row('Masa magra (kg)',A.mm,B.mm,1);
 const ci=W.filter(x=>icc(x));if(ci.length>1)rows+=row('Cintura/cadera (ICC)',icc(ci[0]),icc(ci[ci.length-1]),-1);
 const dG=A&&B?B.gm-A.gm:0,dM=A&&B?B.mm-A.mm:0,rc=!B?'Para estimar tu % de grasa necesito cintura, cadera y cuello. Mídete cada 2 semanas, en ayunas y a la misma hora.':cw.length<2?'Ya tengo tu punto de partida. Con la próxima medida te muestro el cambio de grasa y músculo.':dG<0&&dM>=-.3?'Recomposición en marcha: bajas grasa y conservas o ganas músculo. 🎉':dG<0&&dM<-.8?'Estás perdiendo músculo junto con la grasa. Ajusté tu plan solo (menos déficit y más proteína). Duerme bien y mantén tus pesas.':dG>=0&&dM>0?'Ganas músculo con grasa estable o al alza. Revisa que las calorías no estén por encima del plan.':'Aún no hay un cambio claro. Compara de nuevo en 2-3 semanas.';
 const iv=ci.length?icc(ci[ci.length-1]):null,lab=iv<.8?['bajo','#1b9c82']:iv<=.85?['moderado','#c98a00']:['elevado','#d4513e'],ajOn=S.aj&&S.aj.i1==null;
 return[hd('Progreso',l?`Último peso: ${l.w} kg (${fd(l.d)})`:'Aún sin registros'),
 `<div class=card><h2>Peso real vs. plan</h2>${chart()}<small>Línea coral: tu peso. Marino punteada: lo esperado.</small><p style="margin-top:6px;font-size:14px">${msg}</p></div>`+
 `<div class=card><h2>Recomposición</h2>${B?`<div class=row><b>${B.bf}% grasa</b><small>estimado</small></div><div class=bar style="height:16px"><b style="width:${B.gm/(B.gm+B.mm)*100}%;background:var(--c)"></b></div><div class=row><small>🟠 Grasa ${B.gm} kg</small><small>🟢 Magra ${B.mm} kg</small></div>`:''}${iv?`<div class=row style="margin-top:10px"><b>Cintura/cadera: ${iv}</b><span class=chip style="background:${lab[1]};color:#fff">riesgo ${lab[0]}</span></div><small>Referencia en mujeres: menos de 0,80 bajo · 0,80-0,85 moderado · más de 0,85 elevado.</small>`:''}<p style="font-size:14px;margin-top:8px">${rc}</p>${ajOn?`<p class=chip style="background:var(--c2);white-space:normal">Ajuste activo desde la semana ${S.aj.i0+1}: bajé 30% el déficit y subí la proteína 0,2 g/kg. Se quita solo cuando tu masa magra se recupere.</p>`:''}<p class=s style="margin-top:6px">Estimación con el método de la Marina de EE.UU. (altura, cintura, cadera y cuello). Puede variar 3-4 puntos, así que úsala para ver la tendencia, no el número exacto.</p></div>`+
 (rows?`<div class=card><h2>Inicio vs. actual</h2><table style="min-width:0"><tr><th style="text-align:left">Medida</th><th>Inicio</th><th>Actual</th><th>Cambio</th></tr>${rows}</table></div>`:'')+
 `<div class=card><h2>Registrar medidas</h2><small>Cinta sin apretar, sobre la piel, en ayunas y a la misma hora. Solo el peso es obligatorio.</small><div class=g2><div><label>Peso (kg)</label><input id=pw type=number step=any inputmode=decimal></div>${MD.map(([k,n])=>`<div><label>${n} cm</label><input id=m_${k} type=number step=any inputmode=decimal></div>`).join('')}</div><label>Fecha</label><input id=pd type=date value="${today()}"><button class=btn onclick="lw()">Guardar medidas</button></div>`+
 `<div class=card><h2>Historial</h2>${[...W].reverse().slice(0,8).map(x=>`<div class=row style="padding:5px 0;border-bottom:1px solid #edf3f2"><span>${fd(x.d)}</span><b>${x.w} kg</b><span class=s>${x.c?'cintura '+x.c:''}</span></div>`).join('')||'<small>Sin registros</small>'}</div>`]}

function ciclo(){const p=S.p,c=fase(today());if(!c)return[hd('Ciclo','Desactivado'),`<div class=card><p>Activa "Seguir mi ciclo" en Ajustes para adaptar calorías y entrenos a cada fase.</p></div>`];
 const L=c.L,pc=n=>n/L*100,st=`conic-gradient(#FF7A66 0 ${pc(5)}%,#5FD3B3 ${pc(5)}% ${pc(c.o-2)}%,#2BB39A ${pc(c.o-2)}% ${pc(c.o+1)}%,#13315C ${pc(c.o+1)}% 100%)`;
 const day=n=>n<=5?0:n<c.o-1?1:n<=c.o+1?2:3;
 return[hd('Ciclo',`Día ${c.n} de ${L} · fase ${FA[c.f][0].toLowerCase()}`),
 `<div class=card><div class=ring style="background:${st}"><div class=in><span>Día ${c.n}<br><small>${FA[c.f][0]}</small></span></div><div style="position:absolute;inset:0;transform:rotate(${(c.n-.5)/L*360}deg)"><i style="position:absolute;top:-5px;left:50%;margin-left:-8px;width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid #0B2545"></i></div></div>
 <div class=strip>${Array.from({length:L},(_,i)=>`<span style="background:${FA[day(i+1)][1]};${i+1==c.n?'outline:3px solid #0B2545':''}">${i+1}</span>`).join('')}</div><button class="btn n" onclick="S.p.cs=today();save();R()">Hoy empezó mi período</button></div>`+
 FA.map((f,i)=>`<div class=card style="${i==c.f?'border:2px solid '+f[1]:''}"><div class=row><b>${f[0]}</b><i style="width:14px;height:14px;border-radius:50%;background:${f[1]}"></i></div><p style="font-size:13px;margin-top:4px">${f[2]}</p></div>`).join('')+
 `<p class=s style="text-align:center">Orientación general, no diagnóstico. Si tu ciclo es irregular o tienes dolor intenso, consulta a tu médica.</p>`]}

const FL=[['nombre','Nombre','text'],['edad','Edad','number'],['altura','Altura (cm)','number'],['peso','Peso inicial (kg)','number'],['meta','Peso deseado (kg)','number'],['sem','Horizonte (semanas)','number'],['act','Actividad diaria','sel',[[1.2,'Sedentaria'],[1.375,'Ligera'],[1.55,'Moderada'],[1.725,'Alta']]],['dias','Días de pesas en el gym por semana','sel',[[3,'3'],[4,'4'],[5,'5']]],['nc','Comidas al día','sel',[[3,'3'],[4,'4'],[5,'5']]],['wake','Hora de despertar','time'],['tr','Hora de entrenar','time'],['ini','Fecha de inicio','date'],['cy','Seguir mi ciclo','sel',[['si','Sí'],['no','No']]],['cs','Primer día de mi último período','date'],['cl','Duración del ciclo (días)','number']];
const DEF={nombre:'',edad:30,altura:165,peso:70,meta:63,sem:16,act:1.375,dias:4,nc:4,wake:'06:30',tr:'18:00',ini:today(),cy:'si',cs:addD(today(),-10),cl:28};
const form=p=>FL.map(([k,l,t,o])=>`<label>${l}</label>`+(t=='sel'?`<select id=f_${k}>${o.map(([v,n])=>`<option value="${v}"${v==p[k]?' selected':''}>${n}</option>`).join('')}</select>`:`<input id=f_${k} type=${t} value="${p[k]??''}" ${t=='number'?'step=any inputmode=decimal':''}>`)).join('');
function sp(){const p={};FL.forEach(([k,,t])=>{const v=$('#f_'+k).value;p[k]=t=='number'||['act','dias','nc'].includes(k)?+v:v});
 if(!p.nombre||!p.peso||!p.altura||p.sem<4){alert('Completa nombre, altura y peso, y usa un horizonte de 4 semanas o más.');return}const b=base(p);if(b.need&&confirm(b.w+'\n\n¿Usar '+b.need+' semanas para llegar a tu meta?'))p.sem=b.need;S.p=p;save();tab='hoy';sel=null;R()}
function aj(){return[hd('Ajustes','Cambia tus datos y el plan se recalcula solo'),
 `<div class=card>${form(S.p)}<button class=btn onclick="sp()">Guardar y recalcular plan</button></div>
 <div class=card><h2>Respaldo de datos</h2><p class=s>Tus datos viven solo en este dispositivo. Si limpias el navegador se borran, así que exporta seguido.</p><button class="btn m" onclick="xl()">📥 Exportar datos a Excel</button><button class="btn n" onclick="jx()">Guardar copia para restaurar (.json)</button><label>Restaurar desde copia .json</label><input type=file accept=".json" onchange="imp(this.files[0])"></div>
 <p class=s style="text-align:center">App orientativa; no reemplaza a tu médica o nutricionista. Consulta antes de empezar si tienes alguna condición de salud o embarazo.</p>`]}

/* ---------- Respaldo ---------- */
const esc=s=>String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const sh=(n,rows)=>`<Worksheet ss:Name="${n}"><Table>${rows.map(r=>`<Row>${r.map(v=>`<Cell><Data ss:Type="${typeof v=='number'?'Number':'String'}">${esc(v)}</Data></Cell>`).join('')}</Row>`).join('')}</Table></Worksheet>`;
const dl=(t,n,ty)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()};
function xl(){const p=S.p,c=curve(p),ex=[['Fecha','Grupos de pesas','Sensación pesas','Minutos','Nota','HIIT equipo','HIIT sensación']];Object.keys(S.t).sort().forEach(d=>{const t=S.t[d];ex.push([d,(t.g||[]).join(', '),SN[t.s]||'',t.m??'',t.n||'',t.hiit?(t.hiit.eq=='cam'?'Caminadora':'Bici'):'',SN[t.hiit&&t.hiit.s]||''])});
 const x=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">`+
 sh('Perfil',Object.entries(p))+sh('Plan',[['Semana','Fase','kcal','Proteína g','Carbo g','Grasa g','Peso esperado','Cardio min','Pasos'],...c.slice(1).map((v,i)=>{const w=wk(p,i);return[i+1,w.fase,w.k,w.pr,w.ch,w.fa,v,w.cardio,w.pasos]})])+
 sh('Peso',[['Fecha','Peso kg','Cintura','Abdomen','Cadera','Cuello','Pecho','Brazo','Muslo','% grasa est.','Masa grasa kg','Masa magra kg','ICC cintura/cadera'],...S.w.map(w=>{const q=comp(w);return[w.d,w.w,w.c??'',w.ab??'',w.ca??'',w.cu??'',w.pe??'',w.br??'',w.mu??'',q?q.bf:'',q?q.gm:'',q?q.mm:'',icc(w)??'']})])+sh('Entrenos',ex)+
 sh('Habitos',[['Fecha','Vasos de agua','Pasos','Sueño','Cardio','Comidas hechas'],...Object.entries(S.h).map(([d,h])=>[d,h.a||0,h.p?'Sí':'No',h.s?'Sí':'No',h.z?'Sí':'No',(h.m||[]).filter(Boolean).length])])+`</Workbook>`;
 dl(x,'recomp-'+today()+'.xls','application/vnd.ms-excel')}
const jx=()=>dl(JSON.stringify(S),'recomp-copia-'+today()+'.json','application/json');
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();R();alert('Datos restaurados')}catch(e){alert('Ese archivo no es una copia válida')}};r.readAsText(f)}

/* ---------- Render ---------- */
const T=[['hoy','🌊','Hoy'],['plan','📈','Plan'],['ent','🏋️','Entreno'],['prog','⚖️','Progreso'],['ciclo','🌙','Ciclo'],['aj','⚙️','Ajustes']];
const go=k=>{tab=k;R();scrollTo(0,0)};
function R(){if(!S.p){$('#nav').innerHTML='';$('#app').innerHTML=`<header>${hd('Recomp','Cuéntame de ti y armo tu plan')}</header><main><div class=card>${form(DEF)}<button class=btn onclick="sp()">Crear mi plan</button></div></main>`;return}
 $('#nav').innerHTML=T.map(([k,i,l])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}</button>`).join('');
 const v={hoy,plan,ent,prog,ciclo,aj}[tab]();$('#app').innerHTML=`<header>${v[0]}</header><main>${v[1]}</main>`}
R();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');
</script></body></html>
